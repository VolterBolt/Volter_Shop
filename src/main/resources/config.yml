# ============================================================
#                    VOLTER SHOP v1.2.0
# ============================================================

economy:
  # VAULT = EssentialsX / any Vault economy
  # PLAYERPOINTS = PlayerPoints
  # COMMAND = command-based economy
  provider: VAULT

  # Money display format
  format: "$%.2f"

  # Used only when provider: COMMAND
  command:
    balance-placeholder: "%vault_eco_balance%"
    deposit: "eco give {player} {amount}"
    withdraw: "eco take {player} {amount}"


# ============================================================
#                         GUI
# ============================================================

gui:
  title: "&8✦ &6Volter Shop"
  rows: 6


# ============================================================
#                       CATEGORIES
# ============================================================

categories:

  blocks:
    name: "&a&lBlocks"
    icon: GRASS_BLOCK
